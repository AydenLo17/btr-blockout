<style>
/* Butler Tech Robotics theme: 144 orange, 325 blue, charcoal brand bar. Canvas is a cool drafting sheet so crayon parts read clearly. */
:root{
  --paper:#eef1f5; --grid-minor:#dce2ea; --grid-major:#b9c4d3; --grid-label:#6b7a90;
  --ground:#2d3440; --panel:#f7f8fa; --panel-2:#eceff3; --line:#d3d9e1; --fg:#181a1f; --muted:#5d6675;
  --accent:#e85d12; --accent-ink:#ffffff; --accent-soft:#e85d1220;
  --bar:#181818; --bar-2:#262626; --bar-line:#3a3a3a; --bar-fg:#ffffff; --bar-muted:#b9b9b9; --btr-blue:#0b3bbf; --btr-orange:#f26a1b;
  --chassis:#4d5563; --bumper:#b8322a; --envelope:#0b3bbf; --ok:#2f8a3f; --warn:#c98a00; --bad:#c9302c;
  --c-red:#d9463b; --c-orange:#f26a1b; --c-yellow:#d6a714; --c-green:#3f9a4a; --c-blue:#0b3bbf; --c-purple:#7d4fc4; --c-gray:#7b8490; --c-ink:#23262c;
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171b; --grid-minor:#1f232a; --grid-major:#2d3440; --grid-label:#7c8799;
  --ground:#b9c2cf; --panel:#1b1d21; --panel-2:#23262c; --line:#32363e; --fg:#eceef2; --muted:#9aa2af;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#ff7a2e2a;
  --bar:#101010; --bar-2:#1f1f1f; --bar-line:#333; --bar-fg:#ffffff; --bar-muted:#a8a8a8; --btr-blue:#3d6bff; --btr-orange:#ff7a2e;
  --chassis:#a3acba; --bumper:#e2574d; --envelope:#5d86ff; --ok:#57c26a; --warn:#f0b429; --bad:#ff5f56;
  --c-red:#f06a5e; --c-orange:#ff8a3d; --c-yellow:#f2cc3c; --c-green:#62c070; --c-blue:#5d86ff; --c-purple:#a988f0; --c-gray:#a6aeb9; --c-ink:#e1e4ea;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#15171b; --grid-minor:#1f232a; --grid-major:#2d3440; --grid-label:#7c8799;
  --ground:#b9c2cf; --panel:#1b1d21; --panel-2:#23262c; --line:#32363e; --fg:#eceef2; --muted:#9aa2af;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#ff7a2e2a;
  --bar:#101010; --bar-2:#1f1f1f; --bar-line:#333; --bar-fg:#ffffff; --bar-muted:#a8a8a8; --btr-blue:#3d6bff; --btr-orange:#ff7a2e;
  --chassis:#a3acba; --bumper:#e2574d; --envelope:#5d86ff; --ok:#57c26a; --warn:#f0b429; --bad:#ff5f56;
  --c-red:#f06a5e; --c-orange:#ff8a3d; --c-yellow:#f2cc3c; --c-green:#62c070; --c-blue:#5d86ff; --c-purple:#a988f0; --c-gray:#a6aeb9; --c-ink:#e1e4ea;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--panel);color:var(--fg);font:15px/1.4 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#app{display:grid;height:100%;grid-template-columns:228px minmax(0,1fr) 292px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "lib stage props" "lib dock props"}
header.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--bar);color:var(--bar-fg);min-width:0;flex-wrap:wrap;border-bottom:3px solid var(--btr-orange);box-shadow:inset 0 -6px 0 -3px var(--btr-blue)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:54px;height:40px;flex:none}
.bname{display:flex;flex-direction:column;font:800 24px/0.95 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.bname small{font:600 10.5px/1.2 var(--f-cond);letter-spacing:.14em;color:var(--btr-orange);text-transform:uppercase}
#docName{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-weight:600;width:190px;min-width:0;color:var(--bar-fg)}
#docName:hover,#docName:focus{border-color:var(--bar-line);background:var(--bar-2)}
header.top .seg{background:var(--bar-2);border-color:var(--bar-line)}
header.top .seg button{color:var(--bar-muted)}
header.top .seg button[aria-pressed="true"]{background:var(--btr-blue);color:#fff}
header.top .tb{background:var(--bar-2);border-color:var(--bar-line);color:var(--bar-fg)}
header.top .tb:hover{border-color:var(--bar-muted)}
header.top .tb.primary{background:var(--btr-orange);border-color:var(--btr-orange);color:#fff}
header.top .modebadge{border-color:var(--bar-line);color:var(--bar-muted)}
header.top option{color:var(--fg);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:6px 11px;font:600 14px var(--f-cond);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.tb{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;font:600 14px var(--f-cond);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select.tb{padding-right:6px}
.mobile-only{display:none}

aside{background:var(--panel);min-height:0;overflow:auto}
#lib{grid-area:lib;border-right:1px solid var(--line);padding:12px 12px 20px}
#props{grid-area:props;border-left:1px solid var(--line);padding:12px 14px 20px}
h3{font:700 12px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--btr-orange);flex:none}
h3:first-child{margin-top:0}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 8px;text-align:left;min-width:0}
.part:hover{border-color:var(--accent)}
.part b{font:600 14px/1.1 var(--f-cond)}
.part span{font:400 11px var(--f-mono);color:var(--muted)}
.part i{width:22px;height:6px;border-radius:2px;display:block;margin-bottom:3px}
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.layers li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:14px;min-width:0}
.layers li:hover{background:var(--panel-2)}
.layers li.sel{background:var(--accent-soft)}
.layers li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers li .sw{width:10px;height:10px;border-radius:3px;flex:none}
.layers li button{border:0;background:transparent;padding:0 3px;color:var(--muted);font:500 11px var(--f-mono)}
.layers li.hid .nm{opacity:.45;text-decoration:line-through}
.empty{color:var(--muted);font-size:13px}

main.stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.chips{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:600 13px var(--f-cond);letter-spacing:.03em;box-shadow:0 1px 2px #0002}
.chip .v{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.warn .dot{background:var(--warn)} .chip.bad .dot{background:var(--bad)} .chip.bad{border-color:var(--bad)}
.coords{position:absolute;right:12px;bottom:10px;font:500 12px var(--f-mono);color:var(--grid-label);font-variant-numeric:tabular-nums;pointer-events:none;background:var(--paper);padding:2px 6px;border-radius:4px}
.hint{position:absolute;left:12px;bottom:10px;font:500 13px var(--f-cond);color:var(--grid-label);pointer-events:none;letter-spacing:.02em}

#dock{grid-area:dock;border-top:1px solid var(--line);background:var(--panel);padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.poses{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.poses .lbl{font:700 12px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pose{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);overflow:hidden}
.pose button{border:0;background:transparent;padding:5px 12px;font:600 15px var(--f-cond);letter-spacing:.02em}
.pose button.x{padding:5px 9px 5px 2px;color:var(--muted);font-size:13px}
.pose.active{border-color:var(--accent);background:var(--accent-soft)}
#poseName{border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel-2);width:130px}
.joints{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px}
.joint{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 64px;align-items:center;gap:8px;min-width:0}
.joint label{font:600 14px var(--f-cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joint input[type=range]{width:100%;accent-color:var(--accent)}
.joint output{font:500 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center;gap:8px;margin:5px 0}
.field label{font-size:14px;color:var(--muted)}
.field input[type=number],.field input[type=text],.field select{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 7px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.field input[type=text]{font-family:var(--f-ui);font-size:14px}
.field .unit{position:relative}
.field .unit input{padding-right:30px}
.field .unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:400 11px var(--f-mono);color:var(--muted);font-style:normal;pointer-events:none}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.row .tb{flex:1}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.stat b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.kind{font:700 12px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--btr-blue)}
.ttl{font:700 20px/1.1 var(--f-cond);margin:2px 0 8px}
kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel-2)}

.modal-bg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:85vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px #0005}
.modal h2{font:800 24px var(--f-display);text-transform:uppercase;margin:0 0 4px;letter-spacing:.02em}
.lib-list{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.lib-list li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2);min-width:0}
.lib-list li .nm{flex:1;min-width:0}
.lib-list li .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-list li .nm span{font:400 12px var(--f-mono);color:var(--muted)}
.fb-types{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fb-types button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font:600 15px var(--f-cond)}
.fb-types button[aria-pressed="true"]{background:var(--btr-blue);border-color:var(--btr-blue);color:#fff}
.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;font:15px/1.4 var(--f-ui);resize:vertical}
.modal input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px;font:15px var(--f-ui)}
a.tb{text-decoration:none;text-align:center;display:inline-block}
a.tb[aria-disabled="true"]{opacity:.45;pointer-events:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:8px 14px;border-radius:8px;font:600 14px var(--f-ui);z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}

/* Present mode: canvas owns the screen, dock grows for a room to read */
body.present #app{grid-template-columns:0 minmax(0,1fr) 0}
body.present #lib, body.present #props{display:none}
body.present .edit-only{display:none}
body.present .pose button{font-size:20px;padding:8px 16px}
body.present .joint{grid-template-columns:minmax(0,160px) minmax(0,1fr) 80px}
body.present .joint label{font-size:19px}
body.present .joint output{font-size:15px}
body.present .chip{font-size:16px;padding:6px 12px} body.present .chip .v{font-size:15px}

@media (max-width: 900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "dock"}
  #lib,#props{position:fixed;top:0;bottom:0;z-index:40;width:min(320px,88vw);box-shadow:0 0 40px #0006;display:none;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #lib{left:0} #props{right:0}
  body.lib-open #lib, body.props-open #props{display:block}
  .mobile-only{display:inline-flex}
  #docName{width:120px}
  .bname small{display:none}
  .brand .logo{width:44px;height:33px}
  header.top{gap:6px;padding:6px 12px}
  .joints{grid-template-columns:minmax(0,1fr)}
}
body:not(.more) .adv-only{display:none!important}
body:not(.simple) .simple-only{display:none!important}
.coach{position:absolute;right:12px;bottom:36px;width:min(310px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;box-shadow:0 6px 24px #0003;font-size:14px}
.coach b.h{font:700 13px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.coach ol{margin:6px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.coach .row{margin-top:4px}
body.present .coach{display:none}
.opt{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);text-align:left;width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;font:700 16px var(--f-cond);letter-spacing:.02em}
.choice span{font-size:13px;color:var(--muted)}

  }
  openModal(el('h2', {}, 'Team library'), libDocs.length ? list : el('p', { class: 'note' }, 'No layouts saved yet. Use File → Save to library to add the first one.'),
    el('div', { class: 'row' }, el('button', { class: 'tb', onclick: openFile }, 'Back'), el('button', { class: 'tb', onclick: closeModal }, 'Close')));
}

// ---------- boot ----------
(function boot() {
  const s = store.get('blockout.snap'); if (s != null && !isNaN(+s)) snap = +s;
  const sn = store.get('blockout.season'); if (sn && FIELD[sn]) season = sn;
  mode = 'simple'; document.body.classList.add('simple');
  try { const saved = JSON.parse(store.get('blockout.doc') || 'null'); if (saved && saved.doc && Array.isArray(saved.doc.items)) { doc = Object.assign(blankDoc(), saved.doc); doc.robot = Object.assign(defaultRobot(), doc.robot); doc.rules = Object.assign(defaultRules(), doc.rules); libId = saved.libId || null; } } catch (e) {}
  normalizeItems(); lastJSON = JSON.stringify(doc); $('#docName').value = doc.name;
  applyTheme(theme); renderLib();
  new ResizeObserver(() => resize()).observe($('#stage'));
  resize(); refreshUI(true); coachStep();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
  initCaps();
})();
})();
</script>
